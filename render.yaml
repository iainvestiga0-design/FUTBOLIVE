# Despliegue en Render.com (plan gratuito): "New +" > "Blueprint" > elige tu repo de GitHub.
services:
  - type: web
    name: futbolive
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATA_MODE
        value: auto
      - key: PYTHON_VERSION
        value: 3.12.7
